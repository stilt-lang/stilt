fn label(s: Status) -> str {
  match s {
    Pending => "pending"
    Paid => "paid"
    Shipped => "shipped"
  }
}
'''

[E0330]
title = "trait function or constant named without a type"
reference = "traits.functions-without-self"
tier = "advanced"
phase = "types"
help = "A trait's function without `self` is named on a type, as `Count.empty()`, since the trait alone doesn't say which impl to call."
span = "The path that names the trait."

[[E0330.examples]]
wrong = '''
