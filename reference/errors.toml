fn add(a: i64, b: i64) -> i64 { a +% b }
'''
line = 1
right = '''
/// prop: |a: i64, b: i64| add(a, b) == add(b, a)
fn add(a: i64, b: i64) -> i64 { a +% b }
'''

[E0511]
title = "handler that doesn't match its effect"
reference = "handlers.handler-literals"
tier = "advanced"
phase = "types"
help = "A handler implements every operation of its effect, with the parameter and result types that the effect declares. Add the missing operations."
span = "The handler's effect, or `async` in an `async` literal."

[[E0511.examples]]
wrong = '''
effect Ask {
  fn ask() -> i64
  fn tell(n: i64)
}

fn answer() -> i64 {
  with (handler Ask { fn ask() -> i64 { 1 } }) { Ask.ask() }
}
'''
line = 7
right = '''
effect Ask {
  fn ask() -> i64
  fn tell(n: i64)
}

fn answer() -> i64 {
  let h = handler Ask {
    fn ask() -> i64 { 1 }
    fn tell(n: i64) {}
  }
  with h { Ask.ask() }
}
'''

[E0512]
title = "effect that reaches `main`"
reference = "handlers.no-effect-reaches-main"
