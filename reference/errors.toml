  let orders: List<i64> = []
  print("{orders.len()} orders")
}
'''

[E0313]
title = "no such field"
reference = "types.field-access"
tier = "core"
phase = "types"
help = "Check the field's name against the type's declaration. A `Shared<T>`'s fields are read inside `when`, and a field read through an `Option` is the field of the value inside it."
