'''

[E0328]
title = "float in a pattern"
reference = "patterns.floats"
tier = "core"
phase = "types"
help = "Floats don't compare reliably for equality, so a pattern can't match one. Compare it with `<` or `<=` in an `if`, or in a guard."
span = "The pattern."

[[E0328.examples]]
wrong = '''
