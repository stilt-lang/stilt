wrong = '''
fn hex(n: f64) -> str { "{n:x}" }
'''
line = 1
right = '''
fn hex(n: i64) -> str { "{n:x}" }
'''

[E0326]
title = "constant's value isn't a constant expression"
reference = "declarations.constant-expressions"
tier = "core"
phase = "types"
help = "A constant is built from literals and other constants, with no arithmetic and no calls. Write the value itself, as `600`, or compute it in a function."
span = "The first part of the value, in evaluation order, that a constant expression can't hold."

[[E0326.examples]]
wrong = '''
