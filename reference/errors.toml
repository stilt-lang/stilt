  let t = a
  a = b
  b = t
}

fn mixed(inout xs: List<i64>) { swap(inout xs[0], inout xs[1]) }
'''
line = 7
right = '''
fn mixed(inout xs: List<i64>) { xs.swap(0, 1) }
'''

[E0403]
title = "modifying what can't be modified"
reference = "modes.what-can-be-modified"
tier = "core"
phase = "analyses"
help = "A `let` binding or a parameter never changes. Declare the binding with `var`, or copy the parameter into one, as `var x = x`; a closure can't change what it captures."
span = "The place that is modified."

[[E0403.examples]]
wrong = '''
fn total(prices: List<i64>) -> i64 {
  let sum = 0
  for p in prices { sum += p }
  sum
}
'''
line = 3
right = '''
fn total(prices: List<i64>) -> i64 {
  var sum = 0
  for p in prices { sum += p }
  sum
}
'''

[E0404]
title = "changing a list while reading it"
reference = "modes.change-while-iterating"
tier = "core"
phase = "analyses"
help = "Changing a list while a `for` loop reads it would silently copy it. Build the changes in another list and apply them after the loop, or loop over its indexes."
span = "The modification: the place assigned, the argument passed `inout`, or the receiver taken by `inout self`."

[[E0404.examples]]
wrong = '''
fn doubled(inout orders: List<i64>) { for o in orders { orders.push(o) } }
'''
line = 1
right = '''
fn doubled(inout orders: List<i64>) { orders = orders.concat(orders) }
'''

[E0500]
title = "repeated row element"
reference = "effects.repeated-elements"
tier = "core"
phase = "types"
help = "A row names each effect once. Delete the repeated one."
span = "The repeated element."

[[E0500.examples]]
wrong = '''
fn log(message: str) / {io, io} { print(message) }
'''
line = 1
right = '''
fn log(message: str) / io { print(message) }
'''

[E0501]
title = "effect name as a row variable"
reference = "effects.effect-names"
tier = "core"
phase = "items"
help = "`panic` and `alloc` are inferred, never written in a row. To forbid one, write `without alloc` after the signature."
span = "The row variable, where it is declared or written."

[[E0501.examples]]
wrong = '''
fn squares(n: i64) -> List<i64> / alloc { [n * n] }
'''
line = 1
right = '''
