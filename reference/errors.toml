'''

[E0321]
title = "refutable pattern"
reference = "patterns.irrefutable-positions"
tier = "core"
phase = "types"
help = "This pattern can fail to match, so the code needs a way out: write `let Some(n) = name else return …`, or use `match` or `if let`."
