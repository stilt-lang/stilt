title = "value that can't reach another task"
reference = "shared.tasks-and-modes"
tier = "advanced"
phase = "analyses"
help = "A view can't reach another task, since it must not outlive its source. Capture the value it views."
span = "The value given to `Shared.new`, or the capture of the task's function."

[[E0432.examples]]
wrong = '''
use std.task
use std.view

fn counted(xs: List<i64>) -> i64 / async {
  let v = view.View.all(xs)
  task.spawn(|| v.len()).await()
}
'''
line = 6
right = '''
use std.task

fn counted(xs: List<i64>) -> i64 / async {
  task.spawn(|| xs.len()).await()
}
'''

[E0433]
title = "`when` on something that isn't shared"
reference = "shared.when"
tier = "advanced"
phase = "types"
help = "`when` holds shared values, of type `Shared<T>`. Use an ordinary value directly."
span = "The name."

[[E0433.examples]]
wrong = '''
fn bumped(n: i64) -> i64 {
  when n { n + 1 }
}
'''
line = 2
right = '''
fn bumped(n: i64) -> i64 {
  n + 1
}
'''

[E0434]
title = "scope that escapes"
reference = "tasks.scope-that-escapes"
tier = "advanced"
phase = "analyses"
help = "A scope ends when its `task.scope` call returns, so it is used there to start tasks, as `s.spawn(f)`, and never kept or captured by a task."
span = "The first use that keeps the scope: its name, or the closure literal that names it."

[[E0434.examples]]
wrong = '''
use std.task

fn started() -> i64 / {io, async, raise<str>} {
  try task.scope(|s| {
    let t = try s.spawn(|| try s.spawn(|| 1).await())
    t.await()
  })
}
'''
line = 5
right = '''
use std.task

fn started() -> i64 / {io, async, raise<str>} {
  try task.scope(|s| {
    let t = try s.spawn(|| 1)
    t.await()
  })
}
'''

[E0435]
title = "`when` in a lazy value's function"
reference = "polymorphism.lazy-waits-for-nothing"
tier = "advanced"
phase = "analyses"
help = "A `Lazy` computes its value whenever it is first asked for, so its function must not wait for shared values. Read them before, and capture the copy."
span = "The `when`, or the call of a function that has `locks`, inside the function that `Lazy.new` keeps."

[[E0435.examples]]
wrong = '''
use std.sync
use std.lazy

type Rates = { euro: f64 }

fn priced(rates: sync.Shared<Rates>, amount: f64) -> lazy.Lazy<f64> {
  lazy.Lazy.new(|| when rates { amount * rates.euro })
}
'''
line = 7
right = '''
use std.sync
use std.lazy

type Rates = { euro: f64 }

fn priced(rates: sync.Shared<Rates>, amount: f64) -> lazy.Lazy<f64> {
  let euro = when rates { rates.euro }
  lazy.Lazy.new(|| amount * euro)
}
'''

[E0436]
title = "unsafe operation outside `unsafe`"
reference = "c.unsafe-operations"
tier = "systems"
phase = "types"
help = "Calling C, or reading through a pointer, can break every guarantee Stilt makes, so it stands inside `unsafe because \"…\" { … }`, whose reason says why the code is sound."
span = "The call, or the name of the function used as a value."

[[E0436.examples]]
wrong = '''
use std.c

extern fn strlen(s: c.Str) -> u64

pub fn length(text: str) -> u64 {
  text.with_c_str(|s| strlen(s))
}
'''
line = 6
right = '''
use std.c

extern fn strlen(s: c.Str) -> u64

pub fn length(text: str) -> u64 {
  unsafe because "with_c_str ends s with a NUL" { text.with_c_str(|s| strlen(s)) }
}
'''

[E0437]
title = "`unsafe` with no reason"
reference = "c.unsafe-because"
tier = "systems"
phase = "types"
help = "An `unsafe` block's reason says why its code is sound, and `stilt show` prints it beside the block. Write the reason."
span = "The reason."

[[E0437.examples]]
wrong = '''
use std.c

extern fn strlen(s: c.Str) -> u64

pub fn length(text: str) -> u64 {
  unsafe because " " { text.with_c_str(|s| strlen(s)) }
}
'''
line = 6
right = '''
use std.c

extern fn strlen(s: c.Str) -> u64

pub fn length(text: str) -> u64 {
  unsafe because "with_c_str ends s with a NUL" { text.with_c_str(|s| strlen(s)) }
}
'''
