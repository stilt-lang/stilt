[E0510]
title = "property that performs `io`"
reference = "tests.property-io"
tier = "core"
phase = "types"
help = "A property runs on generated cases and gives the same verdict on every run, so it can't read or write the world. Remove the `print`."
span = "The first call that performs `io`."

[[E0510.examples]]
wrong = '''
