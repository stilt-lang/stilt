[E0504]
title = "reason on an arm that isn't a catch-all"
reference = "effects.reasons-only-on-catch-alls"
tier = "core"
phase = "types"
help = "Only a catch-all arm, `_` or a binding, gives a reason with `because`, saying why dropping every error is right. Delete the reason from this arm."
span = "The reason."

[[E0504.examples]]
wrong = '''
type ParseError = | Empty | NotANumber

fn parse(text: str) -> i64 / raise<ParseError> { raise NotANumber }

fn count(text: str) -> i64 {
  try parse(text) catch {
    Empty because "an empty line counts zero" => 0
    NotANumber => 1
  }
}
'''
line = 7
right = '''
type ParseError = | Empty | NotANumber

fn parse(text: str) -> i64 / raise<ParseError> { raise NotANumber }

fn count(text: str) -> i64 {
  try parse(text) catch {
    Empty => 0
    NotANumber => 1
  }
}
'''

[E0505]
title = "raising call without `try`"
reference = "effects.marking"
tier = "core"
phase = "analyses"
help = "A call that can raise is marked, so the places where a function can stop are visible: write `try` before it, and `catch` after it to handle the error here."
span = "The call."

[[E0505.examples]]
wrong = '''
type ParseError = | Empty

fn parse(text: str) -> i64 / raise<ParseError> { raise Empty }

fn total(lines: List<str>) -> i64 / raise<ParseError> { parse(lines[0]) }
'''
line = 5
right = '''
type ParseError = | Empty

fn parse(text: str) -> i64 / raise<ParseError> { raise Empty }

fn total(lines: List<str>) -> i64 / raise<ParseError> { try parse(lines[0]) }
'''

[E0506]
title = "`catch` around a failure that belongs to the caller"
reference = "effects.catch-around-row-variables"
tier = "core"
phase = "analyses"
help = "The failures of a function parameter belong to your caller, unless its type names their error. Write `raise<E>` in the parameter's row to handle them here."
span = "The call."

[[E0506.examples]]
wrong = '''
type ParseError = | Empty

fn parse(text: str) -> i64 / raise<ParseError> { raise Empty }

fn safe(text: str, fallback: fn() -> i64) -> i64 {
  try {
    let n = parse(text)
    n + fallback()
  }
    catch _ because "a failure counts as zero" => 0
}
'''
line = 8
right = '''
type ParseError = | Empty

fn parse(text: str) -> i64 / raise<ParseError> { raise Empty }

fn safe(text: str, fallback: fn() -> i64) -> i64 {
  let n = try parse(text) catch _ because "a failure counts as zero" => 0
  n + fallback()
}
'''

[E0507]
title = "failures passed on without their error type"
reference = "effects.passing-to-paired-variables"
tier = "core"
phase = "analyses"
help = "This would take your caller's failures for an error of its own type. Write `raise<E>` in the parameter's row, so that callers pass only those."
span = "The use of the function: the call, or its name taken as a value."

[[E0507.examples]]
wrong = '''
