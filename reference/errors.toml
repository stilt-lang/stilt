  if n > 0 { "positive" }
  "zero or less"
}
'''
line = 2
right = '''
fn label(n: i64) -> str {
  if n > 0 { "positive" } else { "zero or less" }
}
'''

[E0324]
title = "key path where no function is expected"
reference = "expressions.key-paths"
tier = "core"
phase = "types"
help = "A key path such as `.total` is short for `|x| x.total`, and stands only where a function is expected, as in `orders.map(.total)`."
