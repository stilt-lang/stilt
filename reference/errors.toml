fn button(label: str, on_click: fn() / io) -> Button { Button { label, on_click } }
'''
line = 3
right = '''
type Button = { label: str, on_click: fn() / io }

fn button(label: str, escaping on_click: fn() / io) -> Button { Button { label, on_click } }
'''

[E0509]
title = "row variable on a parameter that passes its effects through"
reference = "effects.row-variables"
tier = "core"
phase = "items"
help = "A function parameter passes the effects its row doesn't name through to the caller, so a row variable adds nothing. Delete it, or mark the parameter `escaping` if the function keeps it."
span = "The first row variable written in the parameter's type."

[[E0509.examples]]
wrong = '''
