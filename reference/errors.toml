'''

[E0342]
title = "operation on a tuple whose arity isn't known"
reference = "variadics.pack-tuples"
tier = "advanced"
phase = "types"
help = "A tuple whose type spreads a pack has a number of elements that the body doesn't know, so it is passed whole or mapped with a spread, never indexed or matched."
span = "The pattern, the element access or the `for`."

[[E0342.examples]]
wrong = '''
fn first<..Ts>(xs: (..Ts)) -> i64 { xs.0 }
'''
line = 1
right = '''
fn first<A, B>(xs: (A, B)) -> A { xs.0 }
'''

[E0343]
title = "malformed spread"
reference = "variadics.type-spreads"
tier = "advanced"
phase = "types"
help = "A spread maps a tuple whose type spreads a pack, once per element, as `[..lists.len()]`. It names exactly one such tuple, and can't stand inside another spread."
span = "The pack, the spread, or the tuple named."

[[E0343.examples]]
wrong = '''
fn sizes<..Ts>(lists: (..List<Ts>)) -> List<i64> { [..1] }
'''
line = 1
right = '''
fn sizes<..Ts>(lists: (..List<Ts>)) -> List<i64> { [..lists.len()] }
'''

[E0344]
title = "pack out of place"
reference = "variadics.packs"
tier = "advanced"
phase = "types"
help = "Only the last type parameter of a function or a type can be a pack, and a trait's parameters never are."
span = "The pack."

[[E0344.examples]]
wrong = '''
trait Wrap<..Ts> {}
'''
line = 1
right = '''
trait Wrap<T> {}
'''

[E0345]
title = "value parameter of a type that can't be compared"
reference = "generics.value-parameters"
tier = "meta"
phase = "items"
help = "Two types are one type when their value arguments are equal, so a value parameter is an integer or a `bool`, which compare exactly. Use an integer, scaled if you need fractions."
span = "The value parameter's type."

[[E0345.examples]]
wrong = '''
type Scaled<k: f64> = { value: f64 }
'''
line = 1
right = '''
type Scaled<k: i64> = { value: f64 }
'''

[E0346]
title = "value parameter that nothing determines"
reference = "generics.value-parameters-determined"
tier = "meta"
phase = "items"
help = "A call writes no value arguments, so a value parameter is found from the types of the arguments or of the result. Use it in one of them, as in `array.Array<i64, n>`."
span = "The value parameter."

[[E0346.examples]]
wrong = '''
fn zeros<n: i64>() -> i64 { n }
'''
line = 1
right = '''
use std.array

fn count<n: i64>(a: array.Array<i64, n>) -> i64 { n }
'''

[E0347]
title = "invalid value argument"
reference = "generics.value-argument-names"
tier = "meta"
phase = "types"
help = "A value argument is a literal, a constant or a value parameter, never a type, a local or a computation, and an array's size is 0 or more."
span = "The argument."

[[E0347.examples]]
wrong = '''
use std.array

fn empty(a: array.Array<i64, -1>) -> i64 { a.len() }
'''
line = 3
right = '''
use std.array

fn empty(a: array.Array<i64, 0>) -> i64 { a.len() }
'''

[E0348]
title = "binding named like a value parameter"
reference = "generics.value-parameters-in-body"
tier = "meta"
phase = "types"
help = "A type written after this binding would still mean the value parameter, not the binding. Give the binding another name."
span = "The binding's name."

[[E0348.examples]]
wrong = '''
use std.array

fn last<n: i64>(a: array.Array<i64, n>) -> i64 {
  let n = n - 1
  a[n]
}
'''
line = 4
right = '''
use std.array

fn last<n: i64>(a: array.Array<i64, n>) -> i64 {
  let i = n - 1
  a[i]
}
'''

[E0349]
title = "staging annotation on a value known only at run time"
reference = "meta.not-static"
tier = "meta"
phase = "analyses"
help = "`comptime` asserts that a value is known while compiling, which this one isn't. Delete `comptime`, which changes nothing the program does, or make the value a value parameter."
span = "The first part of the annotated expression that isn't static."

[[E0349.examples]]
wrong = '''
fn report(n: i64) / io {
  comptime if n > 0 { print("positive") }
}
'''
line = 2
right = '''
fn report(n: i64) / io {
  if n > 0 { print("positive") }
}
'''

[E0350]
title = "type without a shape given to a function that reflects"
reference = "meta.types-without-shape"
tier = "meta"
phase = "analyses"
help = "A function that reflects reads the shape of each type it reaches, and function types, handlers and native types such as `Shared` have none. Leave such fields out, or give the type an impl of a trait the function checks first."
span = "The first argument whose type holds the type without a shape, or the call or the name when none does."

[[E0350.examples]]
wrong = '''
use std.meta

type Job = { name: str, run: fn() -> i64 }

fn leaves<T>(value: T) -> i64 {
  match T.shape() {
    Record(fields) => {
      var total = 0
      for f in fields { total += leaves(f.get(value)) }
      total
    }
    _ => 1
  }
}

fn main() / io {
  let job = Job { name: "build", run: || 1 }
  print("{leaves(job)}")
}
'''
line = 18
right = '''
use std.meta

type Job = { name: str, tries: i64 }

fn leaves<T>(value: T) -> i64 {
  match T.shape() {
    Record(fields) => {
      var total = 0
      for f in fields { total += leaves(f.get(value)) }
      total
    }
    _ => 1
  }
}

fn main() / io {
  let job = Job { name: "build", tries: 1 }
  print("{leaves(job)}")
}
'''

[E0351]
title = "value of a fresh type leaving its arm"
reference = "meta.leaving-arm"
tier = "meta"
phase = "types"
help = "A value whose type is fresh to a reflecting arm can't leave it, since no code outside can name that type. Compute what you need inside the arm, such as a count, and give that."
span = "The expression whose value would leave."

[[E0351.examples]]
wrong = '''
use std.meta

fn elements<T>(value: T) -> i64 {
  var acc = []
  match T.shape() {
    List(c) => { for x in c.get(value) { acc.push(x) } }
    _ => {}
  }
  acc.len()
}

fn main() / io {
  print("{elements([1, 2])}")
}
'''
line = 6
right = '''
use std.meta

fn elements<T>(value: T) -> i64 {
  match T.shape() {
    List(c) => c.get(value).len()
    _ => 0
  }
}

fn main() / io {
  print("{elements([1, 2])}")
}
'''

[E0352]
title = "exported function C can't call"
reference = "c.exported-signatures"
tier = "core"
phase = "types"
help = "C calls an exported function, so it takes and returns only numbers and `bool`, and its name is a C symbol of its own. Keep the rest of the code inside Stilt."
span = "The part of the signature that C can't take, or the name."

[[E0352.examples]]
wrong = '''
/// The checksum of a line of text.
pub extern fn checksum(line: str) -> u32 {
  line.len().to_u32() else 0
}
'''
line = 2
right = '''
/// The checksum of a line of text of `len` bytes.
pub extern fn checksum(len: u64) -> u32 {
  len.to_u32() else 0
}
'''

[E0353]
title = "type C can't take"
reference = "c.types-c-takes"
tier = "systems"
phase = "types"
help = "A foreign function takes what C passes: numbers, `bool`, a `c.Ptr<T>` of them and a `c.Str`. Lend a list's elements with `with_ptr`, as a `c.Ptr<u8>`."
span = "The part of the signature that C can't take: the type, the generic's name, `self`, the parameter's name or the row's element; or the call whose `T` C can't hold."

[[E0353.examples]]
wrong = '''
use std.c

/// zlib's CRC-32 of `len` bytes from `buf`, continuing `crc`.
pub extern fn crc32(crc: u64, buf: List<u8>, len: u32) -> u64
'''
line = 4
right = '''
use std.c

/// zlib's CRC-32 of `len` bytes from `buf`, continuing `crc`.
pub extern fn crc32(crc: u64, buf: c.Ptr<u8>, len: u32) -> u64
'''

[E0400]
title = "`inout` argument marked wrongly"
reference = "expressions.inout-arguments"
tier = "core"
phase = "types"
help = "An argument for an `inout` parameter is marked `inout` at the call, as `bump(inout count)`, so that a change to it is visible there; no other argument is."
span = "The argument."

[[E0400.examples]]
wrong = '''
fn bump(inout count: i64) { count += 1 }

fn twice(inout count: i64) {
  bump(inout count)
  bump(count)
}
'''
line = 5
right = '''
fn bump(inout count: i64) { count += 1 }

fn twice(inout count: i64) {
  bump(inout count)
  bump(inout count)
}
'''

[E0401]
title = "not a place"
reference = "modes.places"
tier = "core"
phase = "types"
help = "Only a variable, a field or an element can be assigned or passed `inout`. Put the value in a `var` first, and pass that."
span = "The expression that isn't a place."

[[E0401.examples]]
wrong = '''
fn bump(inout count: i64) { count += 1 }

fn next(count: i64) -> i64 {
  bump(inout count + 1)
  count
}
'''
line = 4
right = '''
fn bump(inout count: i64) { count += 1 }

fn next(count: i64) -> i64 {
  var n = count
  bump(inout n)
  n
}
'''

[E0402]
title = "overlapping `inout` arguments"
reference = "modes.overlapping-inout"
tier = "core"
phase = "analyses"
help = "Two places that one call modifies can't overlap, since the result would depend on which one is written back last. Use a method made for it, such as `xs.swap(i, j)`, or copy one of them first."
span = "The later of the two overlapping places."

[[E0402.examples]]
wrong = '''
