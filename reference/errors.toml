fn amount(o: Order) -> i64 { o.total }
'''

[E0314]
title = "no such method or member"
reference = "traits.method-resolution"
tier = "core"
phase = "types"
help = "Check the method's name and the receiver's type. A function without `self` is named on its type, as `List.new()`, and a trait's method needs an impl of the trait for the type."
span = "The method's or member's name."

[[E0314.examples]]
wrong = '''
fn count(names: List<str>) -> i64 { names.size() }
'''
line = 1
right = '''
