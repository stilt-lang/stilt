  n
}
'''

[E0322]
title = "unused value"
reference = "expressions.unused-values"
tier = "core"
phase = "types"
help = "A value that a statement computes and drops is usually a mistake, such as calling a method that returns a new list instead of changing the old one. Use the value, or write `let _ = …` to drop it on purpose."
span = "The expression statement."

[[E0322.examples]]
wrong = '''
