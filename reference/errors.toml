fn label(price: Money) -> str {
  match price {
    FREE => "free"
    _ => "paid"
  }
}
'''
line = 11
right = '''
type Money = { cents: i64 }

impl Eq for Money {
  fn eq(self, other: Money) -> bool { self.cents == other.cents }
}

const FREE: Money = Money { cents: 0 }

fn label(price: Money) -> str {
  if price == FREE { "free" } else { "paid" }
}
'''

[E0332]
title = "property that isn't a closure with typed parameters"
reference = "tests.property-form"
tier = "core"
phase = "types"
help = "A property is a closure with typed parameters that returns a `bool`, as `/// prop: |xs: List<i64>| …`, since `stilt test` generates values of each type. A check without parameters is an example, `/// ex:`."
span = "The property's expression, or the parameter without a type or marked `inout`."

[[E0332.examples]]
wrong = '''
