'''

[E0318]
title = "unsatisfied bound"
reference = "traits.unsatisfied-bounds"
tier = "core"
phase = "types"
help = "Using a trait's operation on a type parameter needs the bound, as `<T: Show>` to interpolate a `T`. A type passed in implements the trait: write its `impl`, or choose a type that has one."
span = "Where the bound is needed: the function's or method's name, the operation, the interpolated expression, or the test or doc example."

[[E0318.examples]]
wrong = '''
