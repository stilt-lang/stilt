fn twice(f: fn(i64) -> i64, x: i64) -> i64 { f(f(x)) }
'''
line = 2
right = '''
/// Applies `f` twice.
/// prop: |x: i64| twice(|n| n +% 1, x) == x +% 2
fn twice(f: fn(i64) -> i64, x: i64) -> i64 { f(f(x)) }
'''

[E0334]
title = "member type that names nothing"
reference = "traits.member-types"
tier = "advanced"
phase = "types"
help = "A member type such as `C.Item` names a parameter of a trait that bounds `C`. Check the name against the trait's parameters."
span = "The member type."

[[E0334.examples]]
wrong = '''
