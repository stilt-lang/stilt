  fn at(self, i: i64) -> Option<Item>
}

fn first<C: Collection>(c: C) -> Option<C.Item> { c.at(0) }
'''

[E0335]
title = "ambiguous member type"
reference = "traits.member-types"
tier = "advanced"
phase = "types"
help = "Two bounds give the type parameter a member of that name. Name the one you mean with a generic, as `C: Collection<T>`, and write `T`."
span = "The member type."

[[E0335.examples]]
wrong = '''
trait Collection<Item> {
  fn at(self, i: i64) -> Option<Item>
}

trait Stream<Item> {
  fn next(self) -> Option<Item>
}

fn first<C: Collection + Stream>(c: C) -> Option<C.Item> { None }
'''
line = 9
right = '''
trait Collection<Item> {
  fn at(self, i: i64) -> Option<Item>
}

trait Stream<Item> {
  fn next(self) -> Option<Item>
}

fn first<C: Collection<T> + Stream, T>(c: C) -> Option<T> { None }
'''

[E0336]
title = "`where` bound that isn't on a member type"
reference = "traits.where"
tier = "advanced"
phase = "types"
help = "A type parameter's bound goes beside it, as `<T: Show>`. A `where` clause bounds only member types, such as `C.Item`."
span = "The bounded type, or the `where` keyword on a function of a trait or a trait impl."

[[E0336.examples]]
wrong = '''
fn shown<T>(x: T) -> str where T: Show { "{x}" }
'''
line = 1
right = '''
fn shown<T: Show>(x: T) -> str { "{x}" }
'''

[E0337]
title = "type of the wrong kind"
reference = "traits.constructor-traits"
tier = "advanced"
phase = "types"
help = "A constructor trait's parameter stands for a generic type, so it is written with its type arguments, as `F<i64>`."
span = "The type, or the bound that mixes kinds."

[[E0337.examples]]
wrong = '''
trait Mappable {
  fn transform<A, B>(self: Self<A>, f: fn(A) -> B) -> Self<B>
}

fn size<F: Mappable>(xs: F) -> i64 { 0 }
'''
line = 5
right = '''
trait Mappable {
  fn transform<A, B>(self: Self<A>, f: fn(A) -> B) -> Self<B>
}

fn size<F: Mappable>(xs: F<i64>) -> i64 { 0 }
'''

[E0338]
title = "receiver's type written or missing"
reference = "traits.receiver-types"
tier = "advanced"
phase = "items"
help = "A method's receiver is written `self`, without a type. Only a constructor trait's methods write one, as `self: Self<A>`."
span = "The `self` parameter."

[[E0338.examples]]
wrong = '''
trait Named {
  fn name(self: Self) -> str
}
'''
line = 2
right = '''
trait Named {
  fn name(self) -> str
}
'''

[E0339]
title = "type parameter of a function type that nothing uses"
reference = "polymorphism.function-types"
tier = "advanced"
phase = "types"
help = "A function type's type parameter appears in its parameters or its result, so that each call can tell what it is. Delete the one that doesn't."
span = "The type parameter."

[[E0339.examples]]
wrong = '''
fn first(f: fn<T, U>(T) -> T) -> i64 { f(1) }
'''
line = 1
right = '''
fn first(f: fn<T>(T) -> T) -> i64 { f(1) }
'''

[E0340]
title = "polymorphic function type out of place"
reference = "polymorphism.placement"
tier = "advanced"
phase = "types"
help = "A generic function type is only the type of a parameter or a field. Return a function of known types, as `fn(i64) -> i64`, or make the outer function generic."
span = "The polymorphic function type."

[[E0340.examples]]
wrong = '''
fn make() -> fn<T>(T) -> T { |x| x }
'''
line = 1
right = '''
fn make() -> fn(i64) -> i64 { |x| x }
'''

[E0341]
title = "open record type out of place"
reference = "records.open-parameter-types"
tier = "advanced"
phase = "types"
help = "A record bound ends with `..`, as `P: { name: str, .. }`, and an open record type is only a parameter's type. Elsewhere, name a type parameter with that bound."
span = "The record bound or the open record type."

[[E0341.examples]]
wrong = '''
fn name_of<P: { name: str }>(p: P) -> str { p.name }
'''
line = 1
right = '''
