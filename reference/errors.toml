fn wrap(g: fn() -> i64 / raise<Box>) -> Result<i64, Box> { Result.of(g) }
'''

[E0508]
title = "function parameter that escapes"
reference = "effects.no-escape"
tier = "core"
phase = "analyses"
help = "A function parameter passes its effects through to the caller, so it is only called during the call. Mark it `escaping` to keep it, and its row is then exactly the one written."
