impl Empty for Count {
  fn empty() -> Count { Count { n: 0 } }
}

fn fresh() -> Count { Empty.empty() }
'''
line = 11
right = '''
trait Empty {
  fn empty() -> Self
}

type Count = { n: i64 }

impl Empty for Count {
  fn empty() -> Count { Count { n: 0 } }
}

fn fresh() -> Count { Count.empty() }
'''

[E0331]
title = "constant with a written `Eq` in a pattern"
reference = "patterns.constants-with-written-eq"
tier = "core"
phase = "types"
help = "A pattern compares values field by field, which could disagree with the `eq` you wrote. Compare the constant with `==` in an `if` or a guard."
span = "The pattern."

[[E0331.examples]]
wrong = '''
type Money = { cents: i64 }

impl Eq for Money {
  fn eq(self, other: Money) -> bool { self.cents == other.cents }
}

