}

fn main() / io {
  Log.log("start")
}
'''
line = 6
right = '''
effect Log {
  fn log(msg: str)
}

fn main() / io {
  with (handler Log { fn log(msg: str) { print(msg) } }) { Log.log("start") }
}
'''

[E0513]
