fn reverse(xs: List<i64>) -> List<i64> { xs.fold([], |acc, x| [x].concat(acc)) }
'''
line = 1
right = '''
/// prop: |xs: List<i64>| reverse(reverse(xs)) == xs
fn reverse(xs: List<i64>) -> List<i64> { xs.fold([], |acc, x| [x].concat(acc)) }
'''

[E0333]
title = "parameter type that can't be generated"
reference = "tests.generable-types"
tier = "core"
phase = "types"
help = "`stilt test` can't generate functions, values of a type that has none, or maps whose keys aren't `Eq` and `Hash`. Take values that it can generate, and build the rest inside the property."
span = "The parameter's type."

[[E0333.examples]]
wrong = '''
