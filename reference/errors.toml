# The registry of diagnostic codes.
#
# Every implementation reports these codes. A code is never reused: a retired code keeps its
# entry with `retired = true`. `cargo run -p stilt-registry` generates from it the codes of
# both implementations, the language server's links to the error index, the list of codes
# that the coverage report expects and the error index, docs/errors/, and `just diagnostics`
# and `just coverage` check that they are current.
#
# Each entry gives a short title, the paragraph of the Reference that defines the code, its
# home, the tier in which the diagnostic can first occur, the phase in which it is checked
# (errors.registry-phases), the help that the compiler prints under the diagnostic, and its
# primary span: the place it is reported at, whose line conformance tests compare
# (conformance.diagnostic-lines). Its examples, `[[CODE.examples]]`, each give a program
# `wrong` that makes the mistake, the `line` at which the code is reported, and the program
# `right` fixed, which has no diagnostic; `just guide` checks them. A code whose mistake one
# file can't show, such as one about a manifest, has none.
#
# Ranges: E00xx and W00xx lexical structure; E01xx syntax; E02xx modules and names;
# E03xx types and traits; E04xx modes and exclusivity; E05xx effects and failure; E06xx
# packages and the profiles beside their manifests; E07xx edits that a command refuses.

[E0001]
title = "invalid source text"
reference = "lexical.source-text"
tier = "core"
phase = "syntax"
help = "Save the file as UTF-8, without a byte-order mark and with `\\n` or `\\r\\n` line endings; editors offer these in their encoding settings."
span = "The offending character: the byte-order mark, the first byte that isn't valid UTF-8, or the lone carriage return."

[[E0001.examples]]
wrong = '''
﻿fn main() / io {
  print("hello")
}
'''
line = 1
right = '''
fn main() / io {
  print("hello")
}
'''

[E0002]
title = "unexpected character"
reference = "lexical.whitespace"
tier = "core"
phase = "syntax"
help = "Outside strings and comments, Stilt reads only ASCII, so a curly quote or a symbol pasted from a document isn't code. Retype it, or put it inside a string."
span = "The unexpected character."

[[E0002.examples]]
wrong = '''
fn main() / io {
  print(“hello”)
}
'''
line = 2
right = '''
fn main() / io {
  print("hello")
}
'''

[E0003]
title = "identifier without a letter"
reference = "lexical.case"
tier = "core"
phase = "syntax"
help = "A name needs a letter, since the case of its first letter says whether it names a value or a type: write `first`, not `_1`."
span = "The identifier."

[[E0003.examples]]
wrong = '''
fn main() / io {
  let _1 = 5
  print("{_1}")
}
'''
line = 2
right = '''
fn main() / io {
  let first = 5
  print("{first}")
}
'''

[E0004]
title = "malformed number literal"
reference = "lexical.integer-literals"
tier = "core"
phase = "syntax"
help = "A number literal has no suffix and no leading zero, and `_` stands only between digits. Give the type with an annotation instead, as `let small: u8 = 10`."
span = "The first character at which the literal breaks its grammar: an `_` that isn't between two digits, a leading zero, the character after a base prefix, or the character that directly follows the literal."

[[E0004.examples]]
wrong = '''
fn main() / io {
  let small = 10u8
  print("{small}")
}
'''
line = 2
right = '''
fn main() / io {
  let small: u8 = 10
  print("{small}")
}
'''

[E0005]
title = "unterminated string literal"
reference = "lexical.string-literals"
tier = "core"
phase = "syntax"
help = "A string closes on the line where it opens. For text over several lines, write `\\n` inside it."
span = "The string literal's opening quote."

[[E0005.examples]]
wrong = '''
fn greeting(name: str) -> str {
  "Hello, {name}
}
'''
line = 2
right = '''
fn greeting(name: str) -> str {
  "Hello, {name}"
}
'''

[E0006]
title = "invalid escape"
reference = "lexical.escapes"
tier = "core"
phase = "syntax"
help = "Inside a string, `{` starts an interpolation, so a brace is written `\\{`. The other escapes are `\\n`, `\\t`, `\\r`, `\\0`, `\\\\`, `\\\"` and `\\u{…}`."
span = "The backslash that starts the escape, or the first brace of `{{`."

[[E0006.examples]]
wrong = '''
fn braced(x: i64) -> str {
  "{{x}}"
}
'''
line = 2
right = '''
fn braced(x: i64) -> str {
  "\{{x}}"
}
'''

[E0007]
title = "malformed format spec"
reference = "lexical.format-specs"
tier = "core"
phase = "syntax"
help = "A format spec gives an alignment, a width, a precision and a kind, each optional, as in `{x:>8.2}` or `{n:x}`. A float's precision is `.2`, with no `f`."
span = "The `:` that starts the spec."

[[E0007.examples]]
wrong = '''
fn price(x: f64) -> str {
  "{x:.2f}"
}
'''
line = 2
right = '''
fn price(x: f64) -> str {
  "{x:.2}"
}
'''

[E0008]
title = "nesting too deep"
reference = "lexical.nesting"
tier = "core"
phase = "syntax"
help = "Brackets and interpolations nest at most 256 deep. Name the inner parts with `let` bindings, functions or types; generated code can do the same."
span = "The bracket that opens the 257th level, or the `\"` that begins the string literal whose interpolation opens it."

[[E0008.examples]]
wrong = '''
fn main() / io {
  print("{((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((1))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))}")
}
'''
line = 2
right = '''
fn main() / io {
  let inner = (((1)))
  print("{inner}")
}
'''

[E0100]
title = "syntax error"
reference = "syntax.grammar-errors"
tier = "core"
phase = "syntax"
help = "The code from this token on isn't Stilt. The cause is often just before it, such as a bracket left open or a word from another language."
span = "Where syntax.grammar-errors places it: the first token from which no program can continue, or a misplaced doc comment's first comment."

[[E0100.examples]]
wrong = '''
fn main() / io {
  let mut count = 0
  print("{count}")
}
'''
line = 2
right = '''
fn main() / io {
  var count = 0
  print("{count}")
}
'''

[[E0100.examples]]
wrong = '''
fn main() / io {
  var n = 0
  match 3 {
    3 => n = 1
    _ => {}
  }
  print("{n}")
}
'''
line = 4
right = '''
fn main() / io {
  var n = 0
  match 3 {
    3 => { n = 1 }
    _ => {}
  }
  print("{n}")
}
'''

[E0200]
title = "invalid module name"
reference = "program.module-names"
tier = "core"
phase = "items"
help = "A module's name is its file's path, so each file and directory is named with a lowercase identifier, as `order_lines.lt`, and not `std` or a dependency's name."
span = "The first line of the file."

[E0201]
title = "module header doesn't match its file"
reference = "program.module-header"
tier = "core"
phase = "items"
help = "A module's name comes from its file's path, so its header names the module the file is. Change the header, or rename the file."
span = "The module path in the header."

[[E0201.examples]]
wrong = '''
module orders

fn main() {}
'''
line = 1
right = '''
module main

fn main() {}
'''

[E0202]
title = "`without` given twice"
reference = "program.header-limits"
tier = "core"
phase = "items"
help = "A module's header holds one `without`, which names each limit once, as `without panic, alloc`."
span = "The second `without` of a header, or the limit named again."

[[E0202.examples]]
wrong = '''
module main
without panic, alloc, panic

pub fn halve(n: i64) -> i64 { n / 2 }
'''
line = 2
right = '''
module main
without panic, alloc

pub fn halve(n: i64) -> i64 { n / 2 }
'''

[E0203]
title = "feature of an unsupported tier"
reference = "program.unsupported-tiers"
tier = "advanced"
phase = "items"
help = "This implementation doesn't support that tier of the language yet. Write the code without the feature."
span = "The feature."

[E0204]
title = "fact beyond a `without` limit"
reference = "facts.without"
tier = "core"
phase = "analyses"
help = "A `without` promises that the code, and everything it calls, never does what the limit names. Change the code so that it can't, or remove the limit if the code needs it."
span = "The fact: an operation that panics, allocates, may not end or copies shared data, such as a `while`, a call that recurses or goes through a stored function value, an argument copied for a callee that updates it in place, or a write while a copy lasts; a call, a function named as a value, a comparison, an interpolated value or a store that uses a function or impl that does; or the `unsafe` of a block."

[[E0204.examples]]
wrong = '''
module main
without panic

pub fn first(prices: List<i64>) -> i64 { prices[0] }
'''
line = 4
right = '''
module main
without panic

pub fn first(prices: List<i64>) -> i64 { prices.get(0) else 0 }
'''

[[E0204.examples]]
wrong = '''
fn ratio(part: i64, whole: i64) -> i64 { part * 100 / whole }

pub fn share(part: i64, whole: i64) -> i64 without panic { ratio(part, whole) }
'''
line = 3
right = '''
fn ratio(part: i64, whole: i64) -> i64 {
  if whole == 0 { 0 } else { part * 100 / whole }
}

pub fn share(part: i64, whole: i64) -> i64 without panic { ratio(part, whole) }
'''

[E0205]
title = "unknown module"
reference = "program.namespaces"
tier = "core"
phase = "items"
help = "`use` names a module, as `use std.fs`. A dependency's modules are named after it, once stilt.toml lists it under `[dependencies]`."
span = "The `use` declaration."

[[E0205.examples]]
wrong = '''
use std.fss

fn main() {}
'''
line = 1
right = '''
use std.fs

fn main() {}
'''

[E0206]
title = "import cycle"
reference = "program.no-cycles"
tier = "core"
phase = "items"
help = "Modules can't import one another in a cycle. Move what both need into a third module, which each imports."
span = "The last of the `use` declarations and paths through which the modules of the cycle depend on one another (errors.several-places). A path is placed at its first name."

[E0207]
title = "local named after an imported module"
reference = "program.one-value-namespace"
tier = "core"
phase = "types"
help = "A local can't take the name of an imported module, since `fs.exists` would then mean two things. Rename the local."
span = "The binding's name."

[[E0207.examples]]
wrong = '''
use std.fs

fn main() / io {
  let fs = "notes.txt"
  print(fs)
}
'''
line = 4
right = '''
use std.fs

fn main() / io {
  let path = "notes.txt"
  print(path)
}
'''

[E0208]
title = "name defined twice"
reference = "declarations.unique-names"
tier = "core"
phase = "types"
help = "A name is defined once in its scope, and Stilt has no overloading. Give the second definition a name of its own."
span = "The later of the two names. For a `use` declaration, the declaration, and for a test, its `test` keyword."

[[E0208.examples]]
wrong = '''
fn total(prices: List<i64>) -> i64 { prices.fold(0, |sum, p| sum + p) }

fn total(prices: List<f64>) -> f64 { prices.fold(0.0, |sum, p| sum + p) }
'''
line = 3
right = '''
fn total(prices: List<i64>) -> i64 { prices.fold(0, |sum, p| sum + p) }

fn total_f64(prices: List<f64>) -> f64 { prices.fold(0.0, |sum, p| sum + p) }
'''

[E0209]
title = "name of a prelude item"
reference = "program.prelude-names"
tier = "core"
phase = "items"
help = "The prelude's names, such as `print`, `Option` and `List`, mean the same thing in every module, so nothing else takes them. Choose another name."
span = "The declared name, or the `use` declaration that binds it."

[[E0209.examples]]
wrong = '''
fn print(message: str) {}

fn main() {}
'''
line = 1
right = '''
fn log(message: str) {}

fn main() {}
'''

[E0210]
title = "primitive type name used as a name"
reference = "lexical.primitive-type-names"
tier = "core"
phase = "types"
help = "Type names such as `str`, `i64` and `bool` can't name anything else. Choose another name, such as `text`."
span = "The name."

[[E0210.examples]]
wrong = '''
fn label() -> str {
  let str = "a"
  str
}
'''
line = 2
right = '''
fn label() -> str {
  let text = "a"
  text
}
'''

[E0211]
title = "unknown name"
reference = "declarations.unknown-names"
tier = "core"
phase = "types"
help = "Check the spelling. A local is visible after its `let`, and an item of another module is named through it, as `fs.exists` after `use std.fs`."
span = "The name that doesn't resolve."

[[E0211.examples]]
wrong = '''
fn average(count: i64, sum: i64) -> i64 { sum / cuont }
'''
line = 1
right = '''
fn average(count: i64, sum: i64) -> i64 { sum / count }
'''

[[E0211.examples]]
wrong = '''
fn first(xs: List<i64>) -> Option<i64> { if xs.is_empty() { null } else { Some(xs[0]) } }
'''
line = 1
right = '''
fn first(xs: List<i64>) -> Option<i64> { if xs.is_empty() { None } else { Some(xs[0]) } }
'''

[E0212]
title = "wrong kind of name"
reference = "declarations.wrong-kind-of-name"
tier = "core"
phase = "types"
help = "A name is a value, a type, a trait or a module, and this one is of another kind than the place needs. A record is built with its fields, as `Point { x: 1, y: 2 }`."
span = "The name that refers to the wrong kind of thing."

[[E0212.examples]]
wrong = '''
type Point = { x: i64, y: i64 }

fn origin() -> Point { Point(1, 2) }
'''
line = 3
right = '''
type Point = { x: i64, y: i64 }

fn origin() -> Point { Point { x: 1, y: 2 } }
'''

[E0213]
title = "private item"
reference = "program.visibility"
tier = "core"
phase = "types"
help = "Only an item marked `pub` can be named outside its module. Mark it `pub` in its module, or use what that module exports."
span = "The private item's or member's name."

[E0214]
title = "private item in a public signature"
reference = "program.private-in-signatures"
tier = "core"
phase = "items"
help = "Code outside the module couldn't name a type that a `pub` signature mentions. Mark the type `pub` too, or keep the function private."
span = "The path that names the private type or trait."

[[E0214.examples]]
wrong = '''
type Config = { port: i64 }

pub fn default_config() -> Config { Config { port: 8080 } }
'''
line = 3
right = '''
pub type Config = { port: i64 }

pub fn default_config() -> Config { Config { port: 8080 } }
'''

[E0215]
title = "`self` or `Self` where it doesn't exist"
reference = "traits.methods"
tier = "core"
phase = "types"
help = "`self` exists only in a method, which takes it as its first parameter, and `Self` only in impl and trait blocks. Add `self` to the parameters."
span = "The `self` or `Self`."

[[E0215.examples]]
wrong = '''
type Rect = { w: f64, h: f64 }

impl Rect {
  fn width() -> f64 { self.w }
}
'''
line = 4
right = '''
type Rect = { w: f64, h: f64 }

impl Rect {
  fn width(self) -> f64 { self.w }
}
'''

[E0216]
title = "`break` or `continue` outside a loop"
reference = "expressions.break-and-continue"
tier = "core"
phase = "types"
help = "`break` and `continue` act on a `for` or `while` loop, and can't cross a closure. To stop at the first match, use a method such as `find` or `any`."
span = "The `break` or `continue`."

[[E0216.examples]]
wrong = '''
fn first_negative(xs: List<i64>) -> Option<i64> {
  xs.find(|x| {
    if x < 0 { break }
    false
  })
}
'''
line = 3
right = '''
fn first_negative(xs: List<i64>) -> Option<i64> {
  xs.find(|x| x < 0)
}
'''

[E0217]
title = "alternatives bind different names"
reference = "patterns.or-patterns"
tier = "core"
phase = "types"
help = "Each alternative of a `|` pattern binds the same names, so the arm's body can use them whichever one matched. Give the bindings one name."
span = "The alternative."

[[E0217.examples]]
wrong = '''
type Shape = | Circle(radius: f64) | Square(side: f64)

fn size(s: Shape) -> f64 {
  match s {
    Circle(r) | Square(side) => r
  }
}
'''
line = 5
right = '''
type Shape = | Circle(radius: f64) | Square(side: f64)

fn size(s: Shape) -> f64 {
  match s {
    Circle(r) | Square(r) => r
  }
}
'''

[E0218]
title = "package that isn't a dependency"
reference = "packages.imports"
tier = "core"
phase = "items"
help = "A module imports only from its own package, the standard library and the packages that stilt.toml lists. Add the package to `[dependencies]`."
span = "The `use` declaration."

[E0219]
title = "exported name used twice"
reference = "c.exported-names"
tier = "core"
phase = "items"
help = "An exported function's name is its C symbol, and C has one namespace, so no two exported functions of a package share a name. Rename one of them."
span = "The name of the second function, in the order of the modules' paths and of the functions in each."

[E0220]
title = "malformed macro pattern"
reference = "macros.pattern-checks"
tier = "advanced"
phase = "items"
help = "A pattern names each fragment once, with a kind such as `expr` or `name`. An `expr`, `pattern` or `type` fragment is followed by `,`, `;`, `=>` or the end of its group, which tells it where to stop."
span = "The fragment, or the repetition's `$`."

[[E0220.examples]]
wrong = '''
syntax total {
  ($first: expr $($rest: expr),*) => $first $(+ $rest)*
}

fn main() / io {
  print("{total!(1, 2, 3)}")
}
'''
line = 2
right = '''
syntax total {
  ($first: expr, $($rest: expr),*) => $first $(+ $rest)*
}

fn main() / io {
  print("{total!(1, 2, 3)}")
}
'''

[E0221]
title = "malformed macro template"
reference = "macros.templates"
tier = "advanced"
phase = "items"
help = "A template uses only the fragments that its arm's pattern binds, inside as many repetitions, and it parses as an expression or a pattern. Check the fragment's spelling."
span = "The fragment, the repetition's `$`, or the template's first token when it parses as neither."

[[E0221.examples]]
wrong = '''
syntax double {
  ($number: expr) => $numbr * 2
}

fn main() / io {
  print("{double!(3)}")
}
'''
line = 2
right = '''
syntax double {
  ($number: expr) => $number * 2
}

fn main() / io {
  print("{double!(3)}")
}
'''

[E0222]
title = "use that no arm matches"
reference = "macros.matching"
tier = "advanced"
phase = "types"
help = "A use matches one of the macro's arms token for token. Compare it with the arm that the message names."
span = "The furthest token any arm reached."

[[E0222.examples]]
wrong = '''
syntax between {
  ($x: expr, $low: expr, $high: expr) => $low <= $x && $x <= $high
}

fn main() / io {
  let n = 5
  print("{between!(n, 1)}")
}
'''
line = 7
right = '''
syntax between {
  ($x: expr, $low: expr, $high: expr) => $low <= $x && $x <= $high
}

fn main() / io {
  let n = 5
  print("{between!(n, 1, 10)}")
}
'''

[E0223]
title = "macro out of place"
reference = "macros.uses"
tier = "advanced"
phase = "types"
help = "A macro whose arms give expressions stands where an expression does, and one whose arms give patterns where a pattern does, as in `let pair!(a, b) = p`."
span = "The use's path."

[[E0223.examples]]
wrong = '''
syntax pair {
  ($a: pattern, $b: pattern) => ($a, $b)
}

fn main() / io {
  let p = pair!(1, 2)
  print("{p}")
}
'''
line = 6
right = '''
syntax pair {
  ($a: pattern, $b: pattern) => ($a, $b)
}

fn main() / io {
  let pair!(a, b) = (1, 2)
  print("{a} {b}")
}
'''

[E0224]
title = "expansion too deep"
reference = "macros.nested-expansions"
tier = "advanced"
phase = "types"
help = "A macro may use itself, but each expansion must get closer to an arm that stops, and expansions nest at most 128 deep."
span = "The use the user wrote."

[[E0224.examples]]
wrong = '''
syntax sum {
  ($x: expr) => $x + sum!($x)
}

fn main() / io {
  print("{sum!(1)}")
}
'''
line = 6
right = '''
syntax sum {
  ($x: expr) => $x
  ($x: expr, $($rest: expr),+) => $x + sum!($($rest),+)
}

fn main() / io {
  print("{sum!(1, 2, 3)}")
}
'''

[E0225]
title = "error raised by a macro"
reference = "macros.raised-errors"
tier = "meta"
phase = "types"
help = "The macro rejected its input, and its message says why. Change the use to give it what it expects."
span = "The raised error's span, or the string literal that names the file it lies in."

[E0226]
title = "macro that didn't finish"
reference = "macros.step-limits"
tier = "meta"
phase = "types"
help = "The macro's code ran too long, ran out of memory or panicked, so it was stopped. Look in the macro for a loop that doesn't end on this input."
span = "The use's path."

[E0227]
title = "use whose parts don't fit its macro"
reference = "macros.parts"
tier = "meta"
phase = "types"
help = "A use gives one part per parameter of the macro, separated by commas, and each part has the form its parameter's type asks for: an expression, a pattern, a type or a plain string."
span = "The first token of the part that doesn't fit, the second comma of an empty part, the extra part, or the group's closing bracket when a part is missing."

[E0228]
title = "malformed macro declaration"
reference = "macros.procedural-declarations"
tier = "meta"
phase = "items"
help = "A procedural macro works on code, not values: it takes `meta.Expr`, `meta.Pattern`, `meta.Type`, `meta.Text`, `meta.File` or a last `meta.Tokens`, and gives a `meta.Expr`, `meta.Pattern` or `meta.Type`."
span = "The part of the declaration that breaks the rule."

[[E0228.examples]]
wrong = '''
use std.meta

/// The number, doubled.
pub macro double(n: i64) -> meta.Expr { quote { $n * 2 } }
'''
line = 4
right = '''
use std.meta

/// The number, doubled.
pub macro double(n: meta.Expr) -> meta.Expr { quote { $n * 2 } }
'''

[E0229]
title = "file that a macro can't be given"
reference = "macros.named-files"
tier = "meta"
phase = "types"
help = "A macro reads only a regular UTF-8 file inside the package, named by a relative path spelled exactly as on disk, so that every machine builds the same program."
span = "The string literal that names the file."

[E0230]
title = "`use` of an item"
reference = "program.what-use-binds"
tier = "core"
phase = "items"
help = "`use` imports a module, never an item: write `use std.sync`, then name the item through the module, as `sync.Shared`."
span = "The `use` declaration."

[[E0230.examples]]
wrong = '''
use std.sync.Shared

fn counter() -> Shared<i64> { Shared.new(0) }
'''
line = 1
right = '''
use std.sync

fn counter() -> sync.Shared<i64> { sync.Shared.new(0) }
'''

[E0231]
title = "expansion too large"
reference = "macros.expansion-size"
tier = "advanced"
phase = "types"
help = "A use's expansions, its own and those nested in it, hold at most 100,000 tokens in all. A macro that uses another several times at each level multiplies its code at each one: use it once and reuse its result, or build the repeated part in a function."
span = "The use the user wrote."

[[E0231.examples]]
wrong = '''
syntax q0 { () => 1 }
syntax q1 { () => q0!() + q0!() + q0!() + q0!() }
syntax q2 { () => q1!() + q1!() + q1!() + q1!() }
syntax q3 { () => q2!() + q2!() + q2!() + q2!() }
syntax q4 { () => q3!() + q3!() + q3!() + q3!() }
syntax q5 { () => q4!() + q4!() + q4!() + q4!() }
syntax q6 { () => q5!() + q5!() + q5!() + q5!() }
syntax q7 { () => q6!() + q6!() + q6!() + q6!() }
syntax q8 { () => q7!() + q7!() + q7!() + q7!() }

fn main() / io {
  print("{q8!()}")
}
'''
line = 12
right = '''
syntax q0 { () => 1 }
syntax q1 { () => 4 * q0!() }
syntax q2 { () => 4 * q1!() }
syntax q3 { () => 4 * q2!() }
syntax q4 { () => 4 * q3!() }
syntax q5 { () => 4 * q4!() }
syntax q6 { () => 4 * q5!() }
syntax q7 { () => 4 * q6!() }
syntax q8 { () => 4 * q7!() }

fn main() / io {
  print("{q8!()}")
}
'''

[E0300]
title = "wrong number of type arguments"
reference = "declarations.type-arguments"
tier = "core"
phase = "types"
help = "A generic type takes one type argument per parameter, as `Map<str, i64>` for a map from strings to integers."
span = "The type."

[[E0300.examples]]
wrong = '''
fn count(words: Map<str>) -> i64 { words.len() }
'''
line = 1
right = '''
fn count(words: Map<str, i64>) -> i64 { words.len() }
'''

[E0301]
title = "inherent impl outside the type's module"
reference = "traits.impl-blocks"
tier = "core"
phase = "items"
help = "A type's own methods live in the type's module. Move the impl block there, or write a function in this module instead."
span = "The impl's type."

[E0302]
title = "invalid impl type"
reference = "traits.impl-blocks"
tier = "core"
phase = "items"
help = "An impl block applies to the whole generic type, as `impl<A, B> Pair<A, B>`. For one instantiation alone, write a function that takes it."
span = "The impl's type."

[[E0302.examples]]
wrong = '''
type Pair<A, B> = { first: A, second: B }

impl Pair<i64, i64> {
  fn sum(self) -> i64 { self.first + self.second }
}
'''
line = 3
right = '''
type Pair<A, B> = { first: A, second: B }

fn sum(p: Pair<i64, i64>) -> i64 { p.first + p.second }
'''

[E0303]
title = "orphan impl"
reference = "traits.orphan-rule"
tier = "core"
phase = "items"
help = "An impl of a trait lives in the trait's module or the type's module, so that a type never gets two impls of one trait from two places. Move it to one of them."
span = "The impl's `impl` keyword."

[E0304]
title = "overlapping impls"
reference = "traits.coherence"
tier = "core"
phase = "items"
help = "A type has at most one impl of each trait, so a call always means one thing. Delete one of the impls, or merge them."
span = "The later impl's `impl` keyword."

[[E0304.examples]]
wrong = '''
trait Named {
  fn name(self) -> str
}

type Thing = {}

impl Named for Thing {
  fn name(self) -> str { "a" }
}

impl Named for Thing {
  fn name(self) -> str { "b" }
}
'''
line = 11
right = '''
trait Named {
  fn name(self) -> str
}

type Thing = {}

impl Named for Thing {
  fn name(self) -> str { "a" }
}
'''

[E0305]
title = "missing trait member"
reference = "traits.impl-members"
tier = "core"
phase = "items"
help = "A trait impl defines every method and constant of the trait that has no default. Add the missing member."
span = "The impl's `impl` keyword."

[[E0305.examples]]
wrong = '''
trait Shape {
  fn area(self) -> f64
  fn name(self) -> str
}

type Circle = { radius: f64 }

impl Shape for Circle {
  fn area(self) -> f64 { 3.14 * self.radius * self.radius }
}
'''
line = 8
right = '''
trait Shape {
  fn area(self) -> f64
  fn name(self) -> str
}

type Circle = { radius: f64 }

impl Shape for Circle {
  fn area(self) -> f64 { 3.14 * self.radius * self.radius }
  fn name(self) -> str { "circle" }
}
'''

[E0306]
title = "member not in the trait"
reference = "traits.impl-members"
tier = "core"
phase = "items"
help = "A trait impl holds only the trait's members. Move the other methods to an inherent `impl` block of the type."
span = "The member's name."

[[E0306.examples]]
wrong = '''
trait Shape {
  fn area(self) -> f64
}

type Circle = { radius: f64 }

impl Shape for Circle {
  fn area(self) -> f64 { 3.14 * self.radius * self.radius }
  fn perimeter(self) -> f64 { 6.28 * self.radius }
}
'''
line = 9
right = '''
trait Shape {
  fn area(self) -> f64
}

type Circle = { radius: f64 }

impl Shape for Circle {
  fn area(self) -> f64 { 3.14 * self.radius * self.radius }
}

impl Circle {
  fn perimeter(self) -> f64 { 6.28 * self.radius }
}
'''

[E0307]
title = "method signature differs from the trait's"
reference = "traits.impl-signatures"
tier = "core"
phase = "items"
help = "Callers rely on the signature that the trait declares, so the impl's method takes the same parameters and returns the same result, with `Self` as the impl's type."
span = "The method's name."

[[E0307.examples]]
wrong = '''
trait Shape {
  fn area(self) -> f64
}

type Square = { side: i64 }

impl Shape for Square {
  fn area(self) -> i64 { self.side * self.side }
}
'''
line = 8
right = '''
trait Shape {
  fn area(self) -> f64
}

type Square = { side: f64 }

impl Shape for Square {
  fn area(self) -> f64 { self.side * self.side }
}
'''

[E0308]
title = "inherent method hides a trait method"
reference = "traits.name-clashes"
tier = "core"
phase = "items"
help = "A method's name means one member of a type, so an inherent method and a trait's method can't share it. Rename the inherent method."
span = "The trait impl's `impl` keyword, or the inherent method's name when the impl is structural."

[[E0308.examples]]
wrong = '''
type Point = { x: i64, y: i64 }

impl Point {
  fn show(self) -> str { "({self.x}, {self.y})" }
}

impl Show for Point {
  fn show(self) -> str { "Point({self.x}, {self.y})" }
}
'''
line = 7
right = '''
type Point = { x: i64, y: i64 }

impl Point {
  fn pair(self) -> str { "({self.x}, {self.y})" }
}

impl Show for Point {
  fn show(self) -> str { "Point({self.x}, {self.y})" }
}
'''

[E0309]
title = "record that contains itself"
reference = "declarations.recursive-types"
tier = "core"
phase = "items"
help = "Building such a record would need one already built, forever. Make the field optional, as `next: Option<Node>`, or a list."
span = "The name of the last record of the group that contains itself (errors.several-places)."

[[E0309.examples]]
wrong = '''
type Node = { value: i64, next: Node }
'''
line = 1
right = '''
type Node = { value: i64, next: Option<Node> }
'''

[E0310]
title = "invalid `main`"
reference = "program.main"
tier = "core"
phase = "items"
help = "`main` takes no parameters and returns nothing, and its row allows only `io` and raising an error that can be shown. Read the command line with `std.cli`'s `args()`."
span = "The name of `main`."

[[E0310.examples]]
wrong = '''
fn main(args: List<str>) / io {
  print("{args.len()}")
}
'''
line = 1
right = '''
