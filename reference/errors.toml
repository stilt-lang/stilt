  let n: i64 = 3
  print("{n}")
}
'''

[E0312]
title = "type that can't be inferred"
reference = "types.known-types"
tier = "core"
phase = "types"
help = "A type is inferred from how its value is used within its body, and nothing here says which it is. Write it, as `let orders: List<i64> = []`."
span = "The expression whose type isn't known. For a type the body leaves undecided, the expression that introduced it."

[[E0312.examples]]
wrong = '''
fn main() / io {
  let orders = []
  print("{orders.len()} orders")
}
'''
line = 2
right = '''
