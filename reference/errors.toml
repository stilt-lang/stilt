fn main() / io {
  print("{cli.args().len()}")
}
'''

[E0311]
title = "mismatched types"
reference = "types.mismatch"
tier = "core"
phase = "types"
help = "Stilt never converts a value to another type on its own. Give a value of the expected type, convert it with a method such as `to_f64()`, or change what expects it."
span = "The expression or pattern whose type differs. A block without a final expression is reported at the function's name, the `test` keyword, or the `if` or block whose value it gives."

[[E0311.examples]]
wrong = '''
fn discounted(price: i64) -> i64 { price * 0.9 }
'''
line = 1
right = '''
fn discounted(price: i64) -> i64 { price * 9 / 10 }
'''

[[E0311.examples]]
wrong = '''
fn main() / io {
  let n: i64 = "3"
  print("{n}")
}
'''
line = 2
right = '''
