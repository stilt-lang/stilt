'''

[E0502]
title = "effect that doesn't fit the row"
reference = "effects.inference"
tier = "core"
phase = "types"
help = "A function's row lists the effects it performs, as `/ io` for printing, so that its callers see them. Add the effect to the row."
span = "The first call or `raise` in the body that performs the effect."

[[E0502.examples]]
wrong = '''
fn log(message: str) { print(message) }
'''
line = 1
right = '''
fn log(message: str) / io { print(message) }
'''

[E0503]
title = "two error types"
reference = "effects.one-error-type"
tier = "core"
phase = "types"
help = "Code raises one error type. Declare one type with a variant for each failure, or convert one error into the other where they meet."
span = "The call or `raise` that raises the second error type."

[[E0503.examples]]
wrong = '''
type ParseError = | Empty

fn parse(text: str) -> i64 / raise<ParseError> {
  if text == "" { raise Empty }
  raise "not a number: {text}"
}
'''
line = 5
right = '''
type ParseError = | Empty | NotANumber(str)

fn parse(text: str) -> i64 / raise<ParseError> {
  if text == "" { raise Empty }
