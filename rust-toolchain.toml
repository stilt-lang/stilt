[toolchain]
channel = "1.99"
# llvm-tools: `just toolchain` strips the runtime libraries with rust-objcopy, which on Linux
# loads LLVM only when the component is installed.
components = ["clippy", "rustfmt", "llvm-tools"]
profile = "minimal"
# The targets of `stilt build`, whose runtime libraries `just toolchain` builds
# (goal targets).
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "wasm32-wasip1"]
