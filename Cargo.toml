[workspace]
members = [
    "compiler/*",
    "bench",
    "playground/compiler",
    "tools/grammar",
    "tools/latency",
    "tools/meter",
    "tools/registry",
    "tools/runner",
]
# Zed's extension builds for wasm32-wasip2 alone, in a workspace of its own.
exclude = ["editors/zed"]
resolver = "3"

[workspace.package]
version = "2027.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Shared by several crates, each with the features it needs on top of these.
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
nix = { version = "0.30", default-features = false }
object = { version = "0.40", default-features = false, features = ["std", "read_core", "elf", "macho"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4.6", features = ["derive", "string"] }
rowan = "0.16.1"
rustc-hash = "2.1.3"
salsa = "0.28.5"
serde = { version = "1.0", features = ["derive", "rc"] }
# JSON objects keep their keys in the order the code writes them, in every crate. `llguidance`
# turns this on for `stilt-grammar`, so without it here a build of `stilt` alone would sort
# its keys and a build of the workspace wouldn't, and CI builds both into target/debug.
serde_json = { version = "1.0", features = ["preserve_order"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(stilt_sanitizers)", "cfg(stilt_tsan)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"

# The compiler's debug build, which CI's checks of the conformance suite, the guide's examples
# and generated programs run, keeps its debug assertions and overflow checks, but is optimized
# lightly, which makes it about four times faster for a few seconds more of each build, and its
# dependencies, Cranelift and salsa among them, are optimized further, so that CI runs within
# its budget (goal quick-ci).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The runtime of compiled programs builds as one unit, so that its fast paths, such as taking
# a block from the cache of freed blocks, are inlined however its modules are partitioned
# (goal debug-speed).
[profile.release.package.stilt-runtime]
codegen-units = 1

# The grammar check runs llguidance over millions of bytes within CI's budget (goal
# quick-ci).
[profile.dev.package.llguidance]
opt-level = 3
codegen-units = 1

[profile.dev.package.derivre]
opt-level = 3
codegen-units = 1

# The playground's compiler, built for WebAssembly, which its page downloads: optimized for size,
# as one unit (playground/README.md).
[profile.playground]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
