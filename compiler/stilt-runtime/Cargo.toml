[package]
name = "stilt-runtime"
description = "The runtime of Stilt's compiled programs: objects, reference counts, natives and the entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"

# `poll` and `select` on standard input, without `unsafe` (std.io). WebAssembly polls
# through WASI instead (wasm.what-std-reads).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll"] }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# The runtime is one of the two crates allowed `unsafe` (goal visible-unsafe): it manages the
# memory of compiled programs.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
# `just sanitizers` builds the runtime with this cfg (goal no-memory-errors).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(stilt_sanitizers)", "cfg(stilt_tsan)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"
# A word is a pointer, an index or an integer as its type says, so the runtime reinterprets
# words by design, on the 64-bit hosts it supports (goal targets), and every object it
# allocates is 8-aligned.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_ptr_alignment = "allow"
