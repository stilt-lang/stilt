[package]
name = "stilt-pkg"
description = "Packages: the manifest, the package graph, and fetched dependencies pinned by content hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
stilt-diag = { path = "../stilt-diag" }
stilt-syntax = { path = "../stilt-syntax" }
# BLAKE3 of a package's content (packages.content-hash), the inflating of git's objects and the
# SHA-1 that names each object of a fetched pack, in portable Rust.
blake3.workspace = true
miniz_oxide = "0.8"
sha1_smol = "1.0"
# HTTPS for fetching from `HOST/PATH` (packages.fetching): rustls with ring, whose build needs a C
# compiler, as `aws-lc-rs` would need cmake as well; Mozilla's roots built in, so that a clean
# machine trusts what browsers do, and certificates read from PEM files. `stilt` itself still needs
# nothing else installed (goal one-tool).
rustls.workspace = true
rustls-pki-types = { version = "1.12", features = ["std"] }
webpki-roots = "1.0"
# The SHA-256 of a release toolchain's archive (builds.fetching-toolchain), from the ring that
# rustls already builds.
ring = { version = "0.17", default-features = false }

[lints]
workspace = true
