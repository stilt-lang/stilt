name: Set up Stilt's build
description: >-
  Installs what the justfile's recipes need on a hosted runner: the pinned Rust toolchain, the
  opam switch, just, uv, the C libraries, clang for release builds and, when asked, Lean.

inputs:
  clang:
    description: Install the clang that release builds pin, which `just toolchain` links.
    default: 'true'
  lean:
    description: Install Lean through elan, for `just formal`.
    default: 'false'
  cache-key:
    description: The key that names this job's cargo cache.
    default: build
  save-cache:
    description: Whether this run saves the cargo cache, which runs on the main branch do.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install system libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # gdb: the debugger tests drive it on Linux, as lldb on macOS, and hosted runners have none.
        sudo apt-get install -y --no-install-recommends libffi-dev zlib1g-dev pkg-config gdb

    - name: Install system libraries (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # llvm: the playground's C for WebAssembly needs an LLVM clang, which Apple's isn't.
        brew install pkgconf llvm
        sudo DevToolsSecurity -enable

    - name: Install clang
      if: inputs.clang == 'true'
      shell: bash
      run: |
        # The pinned clang of the release toolchains, checked by the digest toolchains.txt gives
        # it, rather than whatever version the system's packages have.
        case "$RUNNER_OS-$(uname -m)" in
          macOS-arm64) host=aarch64-macos ;;
          Linux-x86_64) host=x86_64-linux ;;
          Linux-aarch64) host=aarch64-linux ;;
          *) echo "::error::no pinned clang for $RUNNER_OS on $(uname -m)"; exit 1 ;;
        esac
        read -r _ url digest < <(grep "^$host " compiler/stilt-cli/src/release/toolchains.txt)
        curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/clang.tar.gz"
        echo "$digest  $RUNNER_TEMP/clang.tar.gz" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/clang"
        tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/clang"
        echo "STILT_CLANG=$RUNNER_TEMP/clang/bin/clang" >> "$GITHUB_ENV"

    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # No lock file names what its cache would hold.
      with:
        enable-cache: false

    - name: Install OCaml and opam
      uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
      with:
        ocaml-compiler: '5.5.2'

    - name: Install the OCaml dependencies
      shell: bash
      run: |
        opam install . --deps-only --with-test --with-dev-setup --yes
        echo "STILT_SWITCH=$(opam switch show)" >> "$GITHUB_ENV"

    # The newest build of the model for this toolchain; the Lean job saves one as soon as the
    # model builds, so a run that later fails or times out still leaves the next one its build.
    - name: Restore Lake's build
      if: inputs.lean == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.elan
          formal/.lake
        key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ github.sha }}
        restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-

    - name: Install Lean
      if: inputs.lean == 'true'
      shell: bash
      run: |
        if [ ! -x "$HOME/.elan/bin/elan" ]; then
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
        fi
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean-toolchain)"
