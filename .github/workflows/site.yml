# The website, with its proof map and playground, built from the commit it runs on and deployed
# to GitHub Pages at stilt.dev. A release deploys it from its tag (release.yml calls this); run it
# by hand to deploy main between releases.

name: Website

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    name: Deploy the website
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          lean: 'true'
          cache-key: site
      # The website builds with Astro, which needs a newer Node than the runners hold.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the model, its proof map, and the website
        run: |
          just build
          (cd formal && lake build Stilt)
          just proof-map
          just site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
