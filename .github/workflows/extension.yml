# Publishes the editor extension of `main`, by hand, to the registries chosen: for a release whose
# own publishing failed, as the first did when the Marketplace refused its display name, or for a
# registry whose token came after the release. Its jobs run in the `release` environment, as the
# release workflow's do.

name: Extension

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: Publish to the Visual Studio Marketplace
        type: boolean
        default: true
      openvsx:
        description: Publish to Open VSX
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: Editor extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: editors/vscode/*.vsix

  publish:
    name: Publish the extension
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: extension
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Visual Studio Marketplace
        if: ${{ inputs.marketplace }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::error::The secret VSCE_PAT is not set"; exit 1; fi
          npx --yes @vscode/vsce@4.1.1 publish --packagePath extension/*.vsix --pat "$VSCE_PAT"
      - name: Open VSX
        if: ${{ inputs.openvsx }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::error::The secret OVSX_PAT is not set"; exit 1; fi
          npx --yes ovsx@0.10.12 publish extension/*.vsix --pat "$OVSX_PAT"
