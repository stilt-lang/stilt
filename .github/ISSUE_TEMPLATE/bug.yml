name: Bug
description: The compiler, a tool, the standard library or the interpreter does something it should not. An internal error, a crash or a hang is a bug of the highest priority.
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: The smallest program that shows it
      description: Paste it, or describe the commands. A program that reproduces the problem is looked at first.
      render: stilt
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
      description: Include the output in full, and the paragraph of the Reference you think says otherwise, if you know it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `stilt --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 on arm64
    validations:
      required: true
