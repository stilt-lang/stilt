name: Documentation
description: A mistake, a gap or an unclear passage in the Reference, the guide or another document.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file and the paragraph, or the address of the page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: If the document and the behaviour disagree, say what you ran. The Reference decides which is right.
    validations:
      required: true
